{% extends "base.html" %}
{% block title %}Log in - Lumen Learn{% endblock %}
{% block content %}
<div class="auth-box">
  <h1 class="page-title">Log in</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" type="email" name="email" value="{{ email or '' }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" name="password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
